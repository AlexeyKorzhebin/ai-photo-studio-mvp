services:
  app:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    ports:
      - "8088:8088"
    environment:
      APP_PORT: 8088
      DATABASE_URL: sqlite:///./data/app.db
      ASSET_STORAGE_DIR: ./data/assets
      EXPORT_STORAGE_DIR: ./data/exports
      GENERATION_PROVIDER: auto
    volumes:
      - ../../data:/app/data
